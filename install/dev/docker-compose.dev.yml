version: "3"

services:
  site_dev:
    container_name: grenier-dev
    build:
      context: ../../.
      args:
        - environment=DEV
      dockerfile: ./install/dev/Dockerfile_dev
    image: my-vide-grenier-dev
    environment:
      - "APACHE_LOG_DIR:/var/www/html/public"
      - "ENVIRONMENT=development"
    ports:
      - 8095:80
    depends_on:
      - mysql_dev
    networks:
      - backend

  mysql_dev:
    container_name: mysql-dev
    image: mysql:latest
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=videgrenierenligne_dev
      - MYSQL_USER=webapplication
      - MYSQL_PASSWORD=653rag9T
    volumes:
      - ../.././sql:/docker-entrypoint-initdb.d
    networks:
      - backend

networks:
  backend:
    driver: bridge
